name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Publish build log to ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logs
          echo "${{ steps.build.outcome }} ${{ github.sha }} run=${{ github.run_number }}" > /tmp/logs/status.txt
          grep -nE "^e: |error:|FAILED|What went wrong|Could not|Unresolved|BUILD (SUCCESSFUL|FAILED)" -A4 build.log > /tmp/logs/summary.txt || true
          tail -250 build.log > /tmp/logs/tail.txt || true
          cp build.log /tmp/logs/full.log || true
          cd /tmp/logs
          git init -q
          git checkout -q -b ci-logs
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Create release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk IPTVPlayer.apk
          gh release create "v1.0.${{ github.run_number }}" IPTVPlayer.apk \
            --title "IPTV Player 1.0.${{ github.run_number }}" \
            --notes "Install IPTVPlayer.apk on your Android phone, Android TV or Fire TV." \
            --latest

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: IPTVPlayer
          path: IPTVPlayer.apk
